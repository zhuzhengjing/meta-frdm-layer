# Fix for simultaneous playback + recording on i.MX93 FRDM (AK4619)
#
# Problem: pw-play then pw-record on the same AK4619 card causes playback noise.
# Direct ALSA (aplay+arecord) works fine, so it's PipeWire-specific.
#
# This config applies three fixes:
# 1. Disable MMAP mode — use read/write ALSA access instead, avoids
#    potential DMA/IOMMU interference between capture and playback buffers
# 2. Prevent ALSA node suspend — keeps PCM always open, avoids
#    costly close/reopen/DAPM power cycling when streams connect
# 3. Remove node.group — separates playback and capture into independent
#    driver groups so starting capture can't affect playback's scheduling

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        # Prevent suspend: keep ALSA PCM always open
        session.suspend-timeout-seconds = 0
        node.pause-on-idle              = false

        # Disable MMAP: use read/write ALSA access instead
        api.alsa.disable-mmap           = true

        # Extra buffer headroom (samples) to absorb timing jitter
        api.alsa.headroom               = 1024

        # Break shared driver group: playback and capture run independently
        node.group                      = ""
        node.link-group                 = ""
      }
    }
  }
]
